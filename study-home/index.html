<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D1622">
  <title>学習ホーム | Classroom</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .home-header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .home-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .grade-control { display: flex; align-items: center; gap: 12px; margin-top: 16px; color: var(--color-text); }
    .grade-control select, .settings-panel select, .settings-panel input[type="date"], .settings-panel input[type="text"] {
      min-height: 44px; padding: 8px 12px; border: 1px solid var(--color-border);
      border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit;
    }
    .grade-control select:focus-visible, .settings-panel select:focus-visible, .settings-panel input:focus-visible, .home-button:focus-visible {
      outline: 3px solid var(--color-accent); outline-offset: 3px;
    }
    .home-button {
      min-height: 44px; padding: 8px 16px; border: 1px solid var(--color-border);
      border-radius: 10px; background: var(--color-surface); color: var(--color-heading);
      font: inherit; cursor: pointer;
    }
    .home-button:hover { background: var(--color-surface-hover); }
    .choice-card[hidden] { display: none; }
    .home-actions[hidden], .grade-control[hidden],
    #initial-grade-screen[hidden], #subject-home[hidden] { display: none; }
    .initial-grade-group + .initial-grade-group { margin-top: 28px; }
    .initial-grade-group h2 { margin: 0 0 12px; font-size: 1.2rem; color: var(--color-heading); }
    .initial-grade-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .initial-grade-choice { width: 100%; min-height: 64px; padding: 12px 8px; justify-content: center; font-family: inherit; font-size: 1.1rem; cursor: pointer; }
    .initial-grade-choice span { display: none; }
    .initial-grade-choice:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
    .free-study { margin-top: 26px; }
    .free-study a { color: var(--color-heading); text-underline-offset: 3px; }
    .home-status { min-height: 1.5em; margin: 12px 0 0; color: var(--color-heading); }
    .settings-panel { max-width: 640px; color: var(--color-text); }
    .settings-panel[hidden], .home-screen[hidden], .settings-panel [hidden] { display: none; }
    .settings-panel h1 { margin: 0 0 18px; color: var(--color-heading); }
    .settings-panel fieldset { margin: 0 0 20px; padding: 0; border: 0; }
    .settings-panel legend, .settings-panel label.field-label { display: block; margin: 0 0 8px; color: var(--color-heading); font-weight: 700; }
    .settings-panel .radio-choice { display: inline-flex; align-items: center; min-height: 44px; gap: 6px; margin-right: 22px; }
    .settings-panel .field { margin-bottom: 18px; }
    .settings-panel select { width: 100%; }
    .home-screen .choice-card { width: 100%; font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
    .screen-back { margin-top: 20px; }
    .candidate-more { display: inline-block; margin-top: 18px; color: var(--color-heading); text-underline-offset: 3px; }
    .candidate-math { display: grid; gap: 14px; }
    .candidate-lesson { min-width: 0; padding: 16px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); }
    .candidate-lesson.is-scheduled { border-color: var(--color-accent); }
    .candidate-number { margin: 0 0 4px; color: var(--color-heading); font-weight: 700; }
    .candidate-title { margin: 0 0 12px; color: var(--color-text); font-size: .9rem; font-weight: 400; line-height: 1.5; }
    .candidate-timing { display: inline-block; margin-left: 8px; font-size: .8rem; font-weight: 400; }
    .candidate-preview { min-height: 6em; overflow-wrap: anywhere; color: var(--color-heading); line-height: 1.65; }
    .candidate-preview p { margin: 0 0 .55em; }
    .candidate-preview table { max-width: 100%; }
    .candidate-options { margin: .4em 0 1em; padding-left: 1.45em; }
    .candidate-options li + li { margin-top: .2em; }
    .candidate-select { width: 100%; min-height: 48px; margin-top: 12px; }
    .candidate-edge { height: 1px; }
    .settings-help { margin: 6px 0 0; font-size: 0.92rem; }
    .settings-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .settings-actions .save { border-color: var(--color-accent); }
    .today-subject { margin: 0 0 8px; color: var(--color-heading); font-weight: 650; }
    .today-lesson { margin: 0 0 22px; color: var(--color-heading); font-size: 1.2rem; font-weight: 650; line-height: 1.55; }
    .today-secondary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .today-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .progress-list { display: grid; gap: 14px; }
    .progress-row { display: grid; grid-template-columns: minmax(5em, auto) minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    .progress-row select, #progress-grade { min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface); color: var(--color-heading); font: inherit; }
    @media (max-width: 480px) { .progress-row { grid-template-columns: 1fr auto; } .progress-row label { grid-column: 1 / -1; } }
    .school-breaks { margin-top: 18px; border-top: 1px solid var(--color-border); padding-top: 14px; }
    .school-breaks summary { min-height: 44px; cursor: pointer; color: var(--color-heading); font-weight: 700; }
    .school-breaks summary:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
    .school-breaks .field { margin-top: 14px; }
    .school-breaks input { width: 100%; }
    .school-break-list { display: grid; gap: 8px; list-style: none; padding: 0; margin: 12px 0; }
    .school-break-list li { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .school-break-status { min-height: 1.5em; color: var(--color-heading); }
    .calendar-dialog {
      width: min(94vw, 680px); max-height: 90vh; overflow: auto; padding: clamp(14px, 4vw, 24px);
      border: 1px solid var(--color-border); border-radius: 16px;
      background: var(--color-bg); color: var(--color-text);
    }
    .calendar-dialog::backdrop { background: rgba(0, 0, 0, 0.68); }
    .calendar-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .calendar-heading h2 { margin: 0; color: var(--color-heading); }
    .calendar-controls { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 12px; }
    .calendar-controls h3 { margin: 0; text-align: center; color: var(--color-heading); font-size: 1.2rem; }
    .calendar-controls .home-button { padding-inline: 12px; }
    .calendar-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .calendar-grid th, .calendar-grid td { border: 1px solid var(--color-border); text-align: center; color: var(--color-heading); }
    .calendar-grid th { padding: 8px 2px; background: var(--color-surface); }
    .calendar-grid td { height: 48px; padding: 4px 1px; font-size: 1rem; }
    .calendar-grid td.is-holiday { background: var(--color-surface-hover); font-weight: 700; }
    .calendar-grid time[aria-current="date"] { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border: 2px solid var(--color-accent); border-radius: 50%; }
    .calendar-holidays { margin-top: 16px; }
    .calendar-holidays h3 { margin: 0 0 8px; color: var(--color-heading); font-size: 1rem; }
    .calendar-holidays ul { margin: 0; padding-left: 1.4em; }
    .calendar-holidays p { margin: 0; }
    .calendar-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  </style>
  <noscript>
    <style>#subject-home { display: block; } #grade-control-row { display: flex; } #home-actions { display: flex; }</style>
  </noscript>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="home-header-row">
        <p class="site-name">Classroom</p>
        <div class="home-actions" id="home-actions" hidden>
          <button class="home-button" id="open-calendar" type="button">カレンダー</button>
          <button class="home-button" id="open-progress" type="button">進み具合</button>
          <button class="home-button" id="open-settings" type="button">設定</button>
        </div>
      </div>
      <div class="grade-control" id="grade-control-row" hidden>
        <label for="grade">学年</label>
        <select id="grade" disabled>
          <option value="e1">小学1年生</option>
          <option value="e2">小学2年生</option>
          <option value="e3">小学3年生</option>
          <option value="e4">小学4年生</option>
          <option value="e5">小学5年生</option>
          <option value="e6">小学6年生</option>
          <option value="1" selected>中学1年生</option>
          <option value="2">中学2年生</option>
          <option value="3">中学3年生</option>
        </select>
      </div>
    </header>
    <main>
      <section id="initial-grade-screen" aria-labelledby="initial-grade-title" hidden>
        <h1 id="initial-grade-title">学年を選ぶ</h1>
        <p class="hint">最初に学年を選んでください。次回からは科目選択が開きます。</p>
        <section class="initial-grade-group" aria-labelledby="elementary-grades-title">
          <h2 id="elementary-grades-title">小学校</h2>
          <div class="initial-grade-choices">
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e1" aria-label="小学1年生">1年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e2" aria-label="小学2年生">2年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e3" aria-label="小学3年生">3年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e4" aria-label="小学4年生">4年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e5" aria-label="小学5年生">5年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="e6" aria-label="小学6年生">6年生<span aria-hidden="true">›</span></button>
          </div>
        </section>
        <section class="initial-grade-group" aria-labelledby="junior-high-grades-title">
          <h2 id="junior-high-grades-title">中学校</h2>
          <div class="initial-grade-choices">
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="1" aria-label="中学1年生">1年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="2" aria-label="中学2年生">2年生<span aria-hidden="true">›</span></button>
            <button class="choice-card initial-grade-choice" type="button" data-initial-grade="3" aria-label="中学3年生">3年生<span aria-hidden="true">›</span></button>
          </div>
        </section>
      </section>
      <section id="subject-home" hidden>
        <h1 id="subject-home-title" tabindex="-1">今日は何を勉強した？</h1>
        <nav class="choices" aria-label="教科を選ぶ">
        <a class="choice-card" data-subject="math" href="../junior-high/grade-1/math/">数学<span aria-hidden="true">›</span></a>
        <a class="choice-card" data-subject="science" href="../junior-high/grade-1/science/">理科<span aria-hidden="true">›</span></a>
        <a class="choice-card" data-subject="english" href="../junior-high/grade-1/english/">英語<span aria-hidden="true">›</span></a>
        <a class="choice-card" data-subject="social" href="../junior-high/grade-1/social/">社会<span aria-hidden="true">›</span></a>
        <a class="choice-card" data-subject="japanese" href="../junior-high/grade-1/japanese/">国語<span aria-hidden="true">›</span></a>
        <a class="choice-card" data-subject="information" href="../junior-high/grade-3/information/" hidden>情報<span aria-hidden="true">›</span></a>
      </nav>
      <p class="home-status" id="home-status" role="status" aria-live="polite"></p>
      <p class="free-study"><a id="free-study" href="../junior-high/grade-1/">すべての授業から自由に選ぶ</a></p>
      </section>
      <section class="home-screen" id="start-screen" aria-labelledby="start-title" hidden>
        <h1 id="start-title" tabindex="-1">どこから始める？</h1>
        <div class="choices">
          <button class="choice-card" id="start-recent" type="button">今日習ったところから</button>
          <button class="choice-card" id="start-list" type="button">自分で選ぶ</button>
          <button class="choice-card" id="start-diagnostic" type="button">わからないから判定してもらう</button>
        </div>
        <p class="home-status" id="start-status" role="status" aria-live="polite"></p>
        <button class="home-button screen-back" id="start-back" type="button">戻る</button>
      </section>
      <section class="home-screen" id="candidate-screen" aria-labelledby="candidate-title" hidden>
        <h1 id="candidate-title" tabindex="-1">今日習ったところから</h1>
        <p class="home-status" id="candidate-status" role="status" aria-live="polite"></p>
        <div class="choices" id="candidate-list"></div>
        <a class="candidate-more" id="candidate-more" href="#">ほかの授業から選ぶ</a><br>
        <button class="home-button screen-back" id="candidate-back" type="button">戻る</button>
      </section>
      <section class="home-screen" id="destination-screen" aria-labelledby="destination-title" hidden>
        <h1 id="destination-title" tabindex="-1">何を見る？</h1>
        <p id="destination-lesson"></p>
        <div class="choices">
          <button class="choice-card" data-open-kind="lesson" type="button">授業</button>
          <button class="choice-card" data-open-kind="questions" type="button">問題</button>
          <button class="choice-card" data-open-kind="summary" type="button">要約</button>
        </div>
        <p class="home-status" id="destination-status" role="status" aria-live="polite"></p>
        <button class="home-button screen-back" id="destination-back" type="button">戻る</button>
      </section>
      <section class="home-screen" id="today-screen" aria-labelledby="today-title" hidden>
        <p class="today-subject" id="today-subject"></p>
        <h1 id="today-title" tabindex="-1">今日の教材</h1>
        <p class="today-lesson" id="today-lesson"></p>
        <div id="today-materials" hidden>
          <button class="choice-card" id="today-primary" type="button"></button>
          <div class="today-secondary" id="today-secondary"></div>
        </div>
        <p class="home-status" id="today-status" role="status" aria-live="polite"></p>
        <div class="today-navigation">
          <button class="home-button" id="today-list" type="button" hidden>授業一覧から選ぶ</button>
          <button class="home-button" id="today-progress" type="button">進み具合を変更</button>
          <button class="home-button" id="today-back" type="button">科目選択へ戻る</button>
        </div>
      </section>
      <section class="home-screen" id="progress-screen" aria-labelledby="progress-title" hidden>
        <h1 id="progress-title" tabindex="-1">進み具合</h1>
        <div class="grade-control"><label for="progress-grade">学年</label><select id="progress-grade"></select></div>
        <div class="progress-list" id="progress-list"></div>
        <p class="home-status" id="progress-status" role="status" aria-live="polite"></p>
        <button class="home-button screen-back" id="progress-back" type="button">戻る</button>
      </section>
  <section class="settings-panel home-screen" id="settings" aria-labelledby="settings-title" hidden>
    <form id="settings-form">
      <h1 id="settings-title" tabindex="-1">設定</h1>
      <div class="field"><label class="field-label" for="settings-grade">学年</label><select id="settings-grade"></select></div>
      <fieldset id="destination-settings">
        <legend>教科を選んだときに開くもの（全教科共通）</legend>
        <label class="radio-choice"><input type="radio" name="destination" value="lesson"> 授業</label>
        <label class="radio-choice"><input type="radio" name="destination" value="questions"> 問題</label>
        <label class="radio-choice"><input type="radio" name="destination" value="summary"> 要約</label>
      </fieldset>
      <div class="field" id="subject-settings">
        <label class="field-label" for="settings-subject">教科</label>
        <select id="settings-subject">
          <option value="math">数学</option>
          <option value="science">理科</option>
          <option value="english">英語</option>
          <option value="social">社会</option>
          <option value="japanese">国語</option>
          <option value="information">情報</option>
        </select>
        <button class="home-button screen-back" id="reselect-start" type="button">開始場所を選び直す</button>
      </div>
      <div class="field">
        <label class="field-label" for="settings-lesson">今、学校で習っている授業</label>
        <select id="settings-lesson" disabled><option value="">授業を読み込んでいます</option></select>
        <p class="settings-help" id="settings-help">教科ごとに授業を選べます。選んだ授業から始まります。</p>
        <p class="settings-help" id="settings-status" role="status" aria-live="polite"></p>
      </div>
      <details class="school-breaks" id="school-break-settings">
        <summary>学校の休み</summary>
        <p class="settings-help">このブラウザーに保存し、カレンダーには表示しません。</p>
        <ul class="school-break-list" id="school-break-list"></ul>
        <div class="field">
          <label class="field-label" for="school-break-name">休みの名前</label>
          <input id="school-break-name" type="text" maxlength="80" placeholder="夏休みなど">
        </div>
        <div class="field">
          <label class="field-label" for="school-break-start">開始日</label>
          <input id="school-break-start" type="date">
        </div>
        <div class="field">
          <label class="field-label" for="school-break-end">終了日</label>
          <input id="school-break-end" type="date">
        </div>
        <button class="home-button" id="school-break-add" type="button">休みを登録</button>
        <p class="school-break-status" id="school-break-status" role="status" aria-live="polite"></p>
      </details>
      <div class="settings-actions">
        <button class="home-button" id="close-settings" type="button">戻る</button>
        <button class="home-button save" id="save-settings" type="submit" formnovalidate>保存</button>
      </div>
    </form>
  </section>
    </main>
  </div>


  <dialog class="calendar-dialog" id="calendar-dialog" aria-labelledby="calendar-title">
    <div class="calendar-heading">
      <h2 id="calendar-title">カレンダー</h2>
    </div>
    <div class="calendar-controls">
      <button class="home-button" id="calendar-previous" type="button" aria-label="前の月">前月</button>
      <h3 id="calendar-month" aria-live="polite"></h3>
      <button class="home-button" id="calendar-next" type="button" aria-label="次の月">翌月</button>
    </div>
    <table class="calendar-grid" id="calendar-grid" aria-label="カレンダー">
      <thead><tr><th scope="col">日</th><th scope="col">月</th><th scope="col">火</th><th scope="col">水</th><th scope="col">木</th><th scope="col">金</th><th scope="col">土</th></tr></thead>
      <tbody id="calendar-days"></tbody>
    </table>
    <section class="calendar-holidays" aria-labelledby="calendar-holidays-title">
      <h3 id="calendar-holidays-title">祝日・休日</h3>
      <div id="calendar-holidays"></div>
    </section>
    <div class="calendar-footer">
      <button class="home-button" id="calendar-today" type="button">今月</button>
      <button class="home-button" id="close-calendar" type="button">閉じる</button>
    </div>
  </dialog>

  <script src="../assets/calendar.js?v=20261122-date-numbers"></script>
  <script src="../assets/curriculum-page.js?v=20261124-study-progress"></script>
  <script>
(() => {
  'use strict';
  const gradeControl = document.getElementById('grade');
  const initialGradeScreen = document.getElementById('initial-grade-screen');
  const subjectHome = document.getElementById('subject-home');
  const homeActions = document.getElementById('home-actions');
  const gradeControlRow = document.getElementById('grade-control-row');
  const initialGradeChoices = [...document.querySelectorAll('[data-initial-grade]')];
  const subjects = [...document.querySelectorAll('a[data-subject]')];
  const subjectSelect = document.getElementById('settings-subject');
  const lessonSelect = document.getElementById('settings-lesson');
  const settingsGrade = document.getElementById('settings-grade');
  const form = document.getElementById('settings-form');
  const settingsStatus = document.getElementById('settings-status');
  const settingsHelp = document.getElementById('settings-help');
  const homeStatus = document.getElementById('home-status');
  const freeStudy = document.getElementById('free-study');
  const startStatus = document.getElementById('start-status');
  const candidateStatus = document.getElementById('candidate-status');
  const candidateList = document.getElementById('candidate-list');
  const candidateMore = document.getElementById('candidate-more');
  const destinationStatus = document.getElementById('destination-status');
  const destinationLesson = document.getElementById('destination-lesson');
  const todaySubject = document.getElementById('today-subject');
  const todayLesson = document.getElementById('today-lesson');
  const todayStatus = document.getElementById('today-status');
  const todayMaterials = document.getElementById('today-materials');
  const todayPrimary = document.getElementById('today-primary');
  const todaySecondary = document.getElementById('today-secondary');
  const todayList = document.getElementById('today-list');
  const progressGrade = document.getElementById('progress-grade');
  const progressList = document.getElementById('progress-list');
  const progressStatus = document.getElementById('progress-status');
  // Keep the existing home usable if the optional shared script cannot load.
  const progressApi = globalThis.ClassroomStudyProgress || (() => {
    const isObject = (value) => value && typeof value === 'object' && !Array.isArray(value);
    function read() {
      try {
        const raw = localStorage.getItem('classroom-study-home-settings');
        const value = raw ? JSON.parse(raw) : {};
        if (!isObject(value) || ['lessons', 'startModes', 'studyProgressV1'].some((key) => value[key] !== undefined && !isObject(value[key]))) return null;
        return value;
      } catch (_) { return null; }
    }
    function update(change) {
      try {
        const value = read();
        if (!value || change(value) === false) return false;
        localStorage.setItem('classroom-study-home-settings', JSON.stringify(value));
        return true;
      } catch (_) { return false; }
    }
    function setLesson(grade, subject, lessonId) {
      return update((value) => {
        const key = `${grade}:${subject}`;
        const old = value.studyProgressV1?.[key];
        if (old !== undefined && !isObject(old)) return false;
        value.lessons = { ...value.lessons };

      if (!moved && plan.label) cards.get(plan.target)?.card.scrollIntoView({ block: 'center', behavior: 'instant' });
      gesture.abort();
      if (!hasObserver) {
        const loadVisible = () => {
          if (version !== candidateVersion || currentScreen !== 'candidates') return;
          for (const item of cards.values()) {
            const rect = item.card.getBoundingClientRect();
            if (rect.bottom >= -400 && rect.top <= innerHeight + 400) void queuePreview(item);
          }
        };
        window.addEventListener('scroll', loadVisible, { passive: true });
        candidateObservers.push({ disconnect: () => window.removeEventListener('scroll', loadVisible) });
        loadVisible();
        return;
      }
      previewObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          previewObserver.unobserve(entry.target);
          const item = [...cards.values()].find((value) => value.card === entry.target);
          if (item) void queuePreview(item);
        }
      }, { rootMargin: '400px 0px' });
      candidateObservers.push(previewObserver);
      for (const { card } of cards.values()) previewObserver.observe(card);
      edgeObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          if (entry.target === top && start > 0) {
            const first = Math.max(0, start - batch);
            const visibleAnchor = top.nextElementSibling;
            const previousTop = visibleAnchor?.getBoundingClientRect().top;
            addRange(first, start - 1, top.nextSibling);
            start = first;
            // Keep the same lesson in place as earlier cards are inserted.
            // This is not a second jump to today's lesson.
            if (visibleAnchor && Number.isFinite(previousTop)) {
              const shift = visibleAnchor.getBoundingClientRect().top - previousTop;
              if (shift) window.scrollBy({ top: shift, behavior: 'instant' });
            }
          } else if (entry.target === bottom && end < plan.items.length - 1) {
            const last = Math.min(plan.items.length - 1, end + batch);
            addRange(end + 1, last, bottom);
            end = last;
          }
        }
      }, { rootMargin: '150px 0px' });
      candidateObservers.push(edgeObserver);
      edgeObserver.observe(top);
      edgeObserver.observe(bottom);
    }));
  }

  function chooseLesson(lesson) {
    chosenLessonId = lesson.id;
    const persisted = progressApi?.chooseLesson(gradeControl.value, flowSubject, lesson.id) || false;
    if (persisted) syncSettings();
    rememberCurrentFlow();
    if (destination && lesson[destination]) {
      location.assign(lesson[destination]);
      return;
    }
    navigate('destination');
    if (!persisted) destinationStatus.textContent = '設定を保存できません。今回の選択は利用できますが、次回は再選択が必要です。';
  }

  async function showDestination() {
    const grade = gradeControl.value;
    const subject = flowSubject;
    const lessonId = chosenLessonId;
    destinationStatus.textContent = '';
    destinationLesson.textContent = '';
    if (!subject || !lessonId) return;
    try {
      const lesson = (await getLessons(grade, subject)).find((item) => item.id === lessonId);
      if (currentScreen !== 'destination' || flowSubject !== subject || chosenLessonId !== lessonId) return;
      if (!lesson) { destinationStatus.textContent = '授業が見つかりません。戻って選び直してください。'; return; }
      destinationLesson.textContent = lesson.title;
      if (destination && !lesson[destination]) destinationStatus.textContent = `${kindLabels[destination]}は準備中です。ほかの種類を選んでください。`;
      document.querySelectorAll('[data-open-kind]').forEach((button) => {
        const kind = button.dataset.openKind;
        button.textContent = `${kindLabels[kind]}${lesson[kind] ? '' : '（準備中）'}`;
      });
    } catch (_) { if (currentScreen === 'destination') destinationStatus.textContent = '授業を読み込めませんでした。戻って選び直してください。'; }
  }

  async function openKind(kind) {
    const grade = gradeControl.value;
    const subject = flowSubject;
    const lessonId = chosenLessonId;
    if (!Object.prototype.hasOwnProperty.call(kindLabels, kind) || !subject || !lessonId) return;
    try {
      const lesson = (await getLessons(grade, subject)).find((item) => item.id === lessonId);
      if (!lesson || currentScreen !== 'destination' || subject !== flowSubject || lessonId !== chosenLessonId) return;
      destination = kind;
      progressApi?.setDestination(kind);
      if (!lesson[kind]) { destinationStatus.textContent = `${kindLabels[kind]}は準備中です。ほかの種類を選んでください。`; return; }
      location.assign(lesson[kind]);
    } catch (_) { destinationStatus.textContent = '授業を読み込めませんでした。'; }
  }

  async function openSubject(subject) {
    homeStatus.textContent = '';
    const grade = gradeControl.value;
    const key = subjectKey(grade, subject);
    syncSettings();
    if (!selectionBySubject[key] && !startModes[key]) { showStart(subject); return; }
    flowSubject = subject;
    chosenLessonId = selectionBySubject[key] || null;
    navigate('today');
  }

  function subjectLabel(grade, subject) {
    if (subject === 'math') return grade.startsWith('e') ? '算数' : '数学';
    if (subject === 'english' && /^e[34]$/.test(grade)) return '外国語活動';
    return subjectNames[subject] || subject;
  }
  function lessonLabel(lesson) {
    return `${lesson.number ? `第${lesson.number}時限 ` : ''}${lesson.title}`;
  }
  const actionLabels = Object.freeze({ lesson: '授業を見る', questions: '問題を解く', summary: '要約を見る' });

  async function showToday() {
    const version = ++navigationVersion;
    const grade = gradeControl.value;
    const subject = flowSubject;
    currentTodayLesson = null;
    todaySubject.textContent = subject ? subjectLabel(grade, subject) : '';
    todayLesson.textContent = '';
    todayStatus.textContent = '授業を読み込んでいます。';
    todayMaterials.hidden = true;
    todayList.hidden = true;
    if (!subject || !hasSubject(grade, subject)) { todayStatus.textContent = '科目を選び直してください。'; return; }
    await progressApi?.resolvePending(grade, subject);
    if (version !== navigationVersion || currentScreen !== 'today' || grade !== gradeControl.value || subject !== flowSubject) return;
    syncSettings();
    const key = subjectKey(grade, subject);
    const lessonId = selectionBySubject[key];
    const meta = savedSettings.studyProgressV1?.[key] || {};
    chosenLessonId = lessonId || null;
    if (!lessonId) {
      todayLesson.textContent = '開始する授業がまだ決まっていません。';
      todayStatus.textContent = '';
      todayList.hidden = false;
      return;
    }
    try {
      const lesson = (await getLessons(grade, subject)).find((item) => item.id === lessonId);
      if (version !== navigationVersion || currentScreen !== 'today' || grade !== gradeControl.value || subject !== flowSubject) return;
      if (!lesson) {
        todayLesson.textContent = '選んだ授業が見つかりません。';
        todayStatus.textContent = '授業一覧または進み具合から選び直してください。';
        todayList.hidden = false;
        return;
      }
      currentTodayLesson = lesson;
      todayLesson.textContent = lessonLabel(lesson);
      todayStatus.textContent = meta.completed ? '最後の授業まで終了しました。' :
        meta.needsChoice ? '次の授業を進み具合から選んでください。' :
        meta.pending ? '進み具合を確認できませんでした。後でもう一度確認します。' : '';
      const primary = destination || 'questions';
      todayPrimary.dataset.kind = primary;
      todayPrimary.textContent = actionLabels[primary] + (lesson[primary] ? '' : '（準備中）');
      todaySecondary.replaceChildren();
      for (const kind of ['lesson', 'questions', 'summary']) {
        if (kind === primary) continue;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'home-button';
        button.dataset.kind = kind;
        button.textContent = actionLabels[kind] + (lesson[kind] ? '' : '（準備中）');
        todaySecondary.append(button);
      }
      todayMaterials.hidden = false;
    } catch (_) {
      if (version === navigationVersion && currentScreen === 'today') {
        todayStatus.textContent = '授業を読み込めませんでした。時間をおいてもう一度お試しください。';
        todayList.hidden = false;
      }
    }
  }

  function openTodayKind(kind) {
    if (currentScreen !== 'today' || !currentTodayLesson || !Object.prototype.hasOwnProperty.call(actionLabels, kind)) return;
    if (!destination) {
      destination = kind;
      if (progressApi?.setDestination(kind)) syncSettings();
    }
    if (!currentTodayLesson[kind]) {
      todayStatus.textContent = `${kindLabels[kind]}は準備中です。ほかの種類を選んでください。`;
      return;
    }
    location.assign(currentTodayLesson[kind]);
  }

  function openProgress() {
    if (currentScreen === 'grade') return;
    progressReturnScreen = currentScreen === 'progress' ? progressReturnScreen : currentScreen;
    progressGrade.value = gradeControl.value;
    navigate('progress');
  }

  async function showProgress() {
    const version = ++progressVersion;
    const grade = progressGrade.value;
    progressList.replaceChildren();
    progressStatus.textContent = '授業を読み込んでいます。';
    if (!grades.has(grade)) { progressStatus.textContent = '学年を選んでください。'; return; }
    const available = subjects.map((link) => link.dataset.subject).filter((subject) => hasSubject(grade, subject));
    await Promise.all(available.map((subject) => progressApi?.resolvePending(grade, subject)));
    const results = await Promise.all(available.map(async (subject) => {
      try { return { subject, lessons: await getLessons(grade, subject) }; }
      catch (_) { return { subject, lessons: null }; }
    }));
    if (version !== progressVersion || currentScreen !== 'progress' || grade !== progressGrade.value) return;
    syncSettings();
    let failed = false;
    for (const { subject, lessons } of results) {
      const key = subjectKey(grade, subject);
      const row = document.createElement('div');
      row.className = 'progress-row';
      const label = document.createElement('label');
      const select = document.createElement('select');
      select.id = `progress-${grade}-${subject}`;
      label.htmlFor = select.id;
      label.textContent = subjectLabel(grade, subject);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'home-button';
      button.textContent = '変更';
      select.add(new Option('授業を選んでください', ''));
      if (!lessons) {
        failed = true;
        select.disabled = true;
        button.disabled = true;
      } else {
        for (const lesson of lessons) select.add(new Option(lessonLabel(lesson), lesson.id));
        const existing = selectionBySubject[key];
        if (existing && !lessons.some((lesson) => lesson.id === existing)) {
          select.add(new Option('選んだ授業が見つかりません', existing));
        }
        select.value = existing || '';
        button.disabled = lessons.length === 0;
        button.addEventListener('click', () => {
          if (!lessons.some((lesson) => lesson.id === select.value)) { progressStatus.textContent = '授業を選んでください。'; return; }
          if (!progressApi?.chooseLesson(grade, subject, select.value)) { progressStatus.textContent = '進み具合を保存できませんでした。'; return; }
          syncSettings();
          progressStatus.textContent = `${subjectLabel(grade, subject)}の進み具合を変更しました。`;
        });
      }
      row.append(label, select, button);
      progressList.append(row);
    }
    progressStatus.textContent = failed ? '一部の授業を読み込めませんでした。' : '';
  }

  async function showSettingsLessons(subject) {
    const grade = gradeControl.value;
    const version = ++loadVersion;
    const key = subjectKey(grade, subject);
    lessonSelect.disabled = true;
    lessonSelect.replaceChildren(new Option('授業を読み込んでいます', ''));
    settingsStatus.textContent = '';
    settingsHelp.textContent = draftModes[key] === 'list' ? '現在は授業一覧から選びます。' : '教科ごとに授業を選べます。選んだ授業から始まります。';
    try {
      const lessons = await getLessons(grade, subject);
      if (version !== loadVersion || grade !== gradeControl.value || subject !== subjectSelect.value) return;
      lessonSelect.replaceChildren(new Option('授業を選んでください', ''));
      for (const lesson of lessons) {
        const kind = currentDestination();
        const availability = kind && !lesson[kind] ? '（選択中の教材は準備中）' : '';
        lessonSelect.add(new Option(`${lesson.number ? `第${lesson.number}時限 ` : ''}${lesson.title}${lesson.month ? `［${lesson.month}ごろ］` : ''}${availability}`, lesson.id));
      }
      lessonSelect.value = lessons.some((lesson) => lesson.id === draftLessons[key]) ? draftLessons[key] : '';
      lessonSelect.disabled = lessons.length === 0;
      if (!lessons.length) settingsStatus.textContent = 'この科目の授業はまだありません。';
    } catch (_) {
      if (version !== loadVersion) return;
      lessonSelect.replaceChildren(new Option('授業を読み込めませんでした', ''));
      settingsStatus.textContent = '時間をおいて設定を開き直してください。';
    }
  }

  function openSettings() {
    syncSettings();
    draftLessons = { ...selectionBySubject };
    draftModes = { ...startModes };
    dirtyLessons = new Set();
    destinationChanged = false;
    const visible = subjects.filter((link) => !link.hidden).map((link) => link.dataset.subject);
    if (!visible.includes(subjectSelect.value)) subjectSelect.value = visible[0];
    settingsGrade.value = gradeControl.value;
    form.elements.destination.value = destination || '';
    settingsStatus.textContent = '';
    navigate('settings');
    void showSettingsLessons(subjectSelect.value);
  }

  settingsGrade.innerHTML = gradeControl.innerHTML;
  progressGrade.innerHTML = gradeControl.innerHTML;
  const savedGrade = readStorage(gradeKey);
  const params = new URLSearchParams(location.search);
  const requestedGrade = params.get('screen') === 'subjects' && grades.has(params.get('grade')) ? params.get('grade') : null;
  updateGrade(requestedGrade || savedGrade);
  currentScreen = requestedGrade || grades.has(savedGrade) ? 'subject' : 'grade';
  const initialState = history.state && typeof history.state === 'object' ? history.state : {};
  history.replaceState({ ...initialState, classroomHome: { screen: currentScreen, subject: null, lessonId: null, grade: gradeControl.value } }, '', location.href);
  renderScreen(currentScreen);
  initialGradeChoices.forEach((button) => button.addEventListener('click', () => {
    const chosenGrade = button.dataset.initialGrade;
    if (!grades.has(chosenGrade)) return;
    updateGrade(chosenGrade);
    const persisted = saveStorage(gradeKey, chosenGrade);
    navigate('subject');
    if (!persisted) homeStatus.textContent = 'このブラウザーでは学年を保存できません。次回はもう一度選択してください。';
  }));
  function changeGrade(grade) {
    if (!grades.has(grade)) return;
    updateGrade(grade);
    const persisted = saveStorage(gradeKey, grade);
    const url = new URL(location.href);
    if (url.searchParams.get('screen') === 'subjects') {
      url.searchParams.delete('screen');
      url.searchParams.delete('grade');
      history.replaceState(history.state, '', url.href);
    }
    rememberCurrentFlow();
    if (currentScreen === 'settings') {
      void showSettingsLessons(subjectSelect.value);
      if (!persisted) settingsStatus.textContent = '学年を保存できませんでした。';
    } else if (currentScreen !== 'subject') {
      navigate('subject');
      if (!persisted) homeStatus.textContent = '学年を保存できませんでした。';
    } else if (!persisted) homeStatus.textContent = '学年を保存できませんでした。';
  }
  gradeControl.addEventListener('change', () => changeGrade(gradeControl.value));
  settingsGrade.addEventListener('change', () => changeGrade(settingsGrade.value));
  subjects.forEach((link) => link.addEventListener('click', (event) => { event.preventDefault(); void openSubject(link.dataset.subject); }));
  document.getElementById('open-settings').addEventListener('click', openSettings);
  document.getElementById('open-progress').addEventListener('click', openProgress);
  document.getElementById('today-progress').addEventListener('click', openProgress);
  document.getElementById('today-back').addEventListener('click', () => backTo('subject'));
  todayList.addEventListener('click', chooseFromList);
  todayPrimary.addEventListener('click', () => openTodayKind(todayPrimary.dataset.kind));
  todaySecondary.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-kind]');
    if (button) openTodayKind(button.dataset.kind);
  });
  progressGrade.addEventListener('change', () => { void showProgress(); });
  document.getElementById('progress-back').addEventListener('click', () => backTo(progressReturnScreen));
  document.getElementById('close-settings').addEventListener('click', () => backTo('subject'));
  document.getElementById('start-back').addEventListener('click', () => backTo('subject'));
  document.getElementById('candidate-back').addEventListener('click', () => backTo('start'));
  document.getElementById('destination-back').addEventListener('click', () => backTo('candidates'));
  document.getElementById('start-recent').addEventListener('click', () => navigate('candidates'));
  document.getElementById('start-list').addEventListener('click', chooseFromList);
  document.getElementById('start-diagnostic').addEventListener('click', () => { startStatus.textContent = '準備中です。ほかの方法で始めてください。'; });
  candidateMore.addEventListener('click', (event) => { event.preventDefault(); chooseFromList(); });
  document.querySelectorAll('[data-open-kind]').forEach((button) => button.addEventListener('click', () => { void openKind(button.dataset.openKind); }));
  document.getElementById('reselect-start').addEventListener('click', () => showStart(subjectSelect.value));
  subjectSelect.addEventListener('change', () => { void showSettingsLessons(subjectSelect.value); });
  lessonSelect.addEventListener('change', () => {
    const key = subjectKey(gradeControl.value, subjectSelect.value);
    dirtyLessons.add(key);
    if (lessonSelect.value) { draftLessons[key] = lessonSelect.value; draftModes[key] = 'lesson'; }
    else { delete draftLessons[key]; delete draftModes[key]; }
  });
  form.elements.destination.forEach((radio) => radio.addEventListener('change', () => { destinationChanged = true; void showSettingsLessons(subjectSelect.value); }));
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    let persisted = Boolean(progressApi) && !invalidSavedSettings;
    for (const key of dirtyLessons) {
      const [grade, subject] = key.split(':');
      const ok = draftLessons[key] ? progressApi?.chooseLesson(grade, subject, draftLessons[key]) : progressApi?.clearLesson(grade, subject);
      persisted = Boolean(ok) && persisted;
    }
    if (destinationChanged && currentDestination()) persisted = Boolean(progressApi?.setDestination(currentDestination())) && persisted;
    if (persisted) syncSettings();
    navigate('subject');
    homeStatus.textContent = persisted ? '設定を保存しました。' : 'この画面では設定できますが、次回まで保存できません。';
  });
  window.addEventListener('pageshow', () => {
    progressApi?.cancelListChoice();
    syncSettings();
    if (currentScreen === 'today') void showToday();
    if (currentScreen === 'progress') void showProgress();
  });
  window.addEventListener('storage', (event) => {
    if (event.key !== settingsKey) return;
    syncSettings();
    if (currentScreen === 'today') void showToday();
    if (currentScreen === 'progress') void showProgress();
  });
})();
  </script>
  <script>
    (() => {
      'use strict';
      const calendar = globalThis.ClassroomCalendar;
      const open = document.getElementById('open-calendar');
      const dialog = document.getElementById('calendar-dialog');
      if (!calendar) { open.disabled = true; return; }
      const monthHeading = document.getElementById('calendar-month');
      const grid = document.getElementById('calendar-grid');
      const body = document.getElementById('calendar-days');
      const holidays = document.getElementById('calendar-holidays');
      const previous = document.getElementById('calendar-previous');
      const next = document.getElementById('calendar-next');
      let year;
      let month;

      function render() {
        const today = calendar.today();
        const days = calendar.month(year, month);
        const label = `${year}年${month}月`;
        monthHeading.textContent = label;
        grid.setAttribute('aria-label', `${label}のカレンダー`);
        previous.disabled = year === 1 && month === 1;
        next.disabled = year === 9999 && month === 12;
        body.replaceChildren();
        holidays.replaceChildren();
        const holidayList = document.createElement('ul');
        const offset = days[0].weekday;
        const count = Math.ceil((offset + days.length) / 7) * 7;
        let row;
        for (let i = 0; i < count; i++) {
          if (i % 7 === 0) { row = document.createElement('tr'); body.appendChild(row); }
          const cell = document.createElement('td');
          const date = days[i - offset];
          if (date) {
            const time = document.createElement('time');
            time.dateTime = date.isoDate;
            time.textContent = String(date.day);
            time.setAttribute('aria-label', `${year}年${month}月${date.day}日 ${date.weekdayJa}曜日${date.isHoliday ? ` ${date.holidayName}` : ''}`);
            if (date.isoDate === today.isoDate) time.setAttribute('aria-current', 'date');
            if (date.isHoliday) {
              cell.classList.add('is-holiday');
              const item = document.createElement('li');
              item.textContent = `${date.day}日（${date.weekdayJa}） ${date.holidayName}`;
              holidayList.appendChild(item);
            }
            cell.appendChild(time);
          }
          row.appendChild(cell);
        }
        if (holidayList.childElementCount) holidays.appendChild(holidayList);
        else {
          const message = document.createElement('p');
          message.textContent = days[0].holidayKnown ? '今月の祝日・休日はありません。' : 'この年の祝日情報はまだありません。';
          holidays.appendChild(message);
        }
      }

      function shift(amount) {
        month += amount;
        if (month < 1) { month = 12; year--; }
        if (month > 12) { month = 1; year++; }
        render();
      }
      function showCurrentMonth() {
        const today = calendar.today();
        year = today.year;
        month = today.month;
        render();
      }
      open.addEventListener('click', () => { showCurrentMonth(); dialog.showModal(); });
      previous.addEventListener('click', () => shift(-1));
      next.addEventListener('click', () => shift(1));
      document.getElementById('calendar-today').addEventListener('click', showCurrentMonth);
      document.getElementById('close-calendar').addEventListener('click', () => dialog.close());
      new MutationObserver(() => { if (dialog.open) render(); }).observe(document.documentElement, {
        attributes: true, attributeFilter: ['data-calendar-holiday-status', 'data-calendar-holiday-years']
      });
    })();
  </script>
  <script>
    (() => {
      'use strict';
      const calendar = globalThis.ClassroomCalendar;
      const settings = document.getElementById('school-break-settings');
      const list = document.getElementById('school-break-list');
      const status = document.getElementById('school-break-status');
      const name = document.getElementById('school-break-name');
      const start = document.getElementById('school-break-start');
      const end = document.getElementById('school-break-end');
      const add = document.getElementById('school-break-add');
      if (!calendar || !calendar.getSchoolBreaks) { add.disabled = true; return; }

      function render() {
        list.replaceChildren();
        try {
          const periods = calendar.getSchoolBreaks();
          if (!periods.length) {
            const item = document.createElement('li');
            item.textContent = 'まだ登録されていません。';
            list.appendChild(item);
          }
          for (const period of periods) {
            const item = document.createElement('li');
            const description = document.createElement('span');
            description.textContent = `${period.name}：${period.start}〜${period.end}`;
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'home-button';
            remove.textContent = '削除';
            remove.setAttribute('aria-label', `${period.name} ${period.start}から${period.end}を削除`);
            remove.addEventListener('click', () => {
              try {
                const latest = calendar.getSchoolBreaks();
                const index = latest.findIndex((entry) => entry.name === period.name && entry.start === period.start && entry.end === period.end);
                if (index < 0) { status.textContent = 'この休みはすでに削除されています。'; render(); return; }
                calendar.saveSchoolBreaks(latest.filter((_, i) => i !== index));
                status.textContent = '学校の休みを削除しました。';
                render();
              } catch (_) { status.textContent = '学校の休みを保存できませんでした。'; }
            });
            item.appendChild(description);
            item.appendChild(remove);
            list.appendChild(item);
          }
        } catch (_) {
          const item = document.createElement('li');
          item.textContent = '学校の休みを読み込めません。';
          list.appendChild(item);
          status.textContent = '保存されている情報を変更せずに残しています。';
        }
      }

      add.addEventListener('click', () => {
        const period = { name: name.value.trim() || '学校の休み', start: start.value, end: end.value };
        try {
          calendar.fromISO(period.start);
          calendar.fromISO(period.end);
          if (period.start > period.end) { status.textContent = '終了日は開始日以降にしてください。'; return; }
        } catch (_) { status.textContent = '開始日と終了日を選んでください。'; return; }
        try {
          const periods = calendar.getSchoolBreaks();
          if (periods.some((entry) => entry.name === period.name && entry.start === period.start && entry.end === period.end)) {
            status.textContent = '同じ休みがすでに登録されています。';
            return;
          }
          calendar.saveSchoolBreaks([...periods, period]);
          name.value = '';
          start.value = '';
          end.value = '';
          status.textContent = '学校の休みを登録しました。';
          render();
        } catch (_) { status.textContent = '学校の休みを保存できませんでした。'; }
      });
      settings.addEventListener('toggle', () => { if (settings.open) render(); });
      document.getElementById('open-settings').addEventListener('click', () => { if (settings.open) render(); });
    })();
  </script>
</body>
</html>
